<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/secciones/secciones.css" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI -->
    <script>
        tailwind.config = {
        plugins: [daisyui],
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.js"></script> 
</head>
<body>
<section class="max-w-7xl mx-auto py-12 px-4 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
    <!-- Texto -->
    <div>
        <h2 class="text-[var(--negro-tronco)] font-bold mb-4" style="font-size: var(--fuente-h1);">
            EXPLORA
        </h2>
        <p class="text-[var(--negro-tronco)] mb-6" style="font-size: var(--fuente-descripcion);">
            Descubre las nuevas ediciones y colecciones de Fall-Winter '24
        </p>
        <button class="bg-[var(--negro-tronco)] text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-[var(--madera-tostada-elegante)] hover:shadow-lg transition">
            Ver más
        </button>
    </div>
    <!-- Carousel -->
    <div class="relative overflow-hidden" data-carousel>
        <div id="carousel" class="flex transition-transform duration-500 ease-in-out" data-track>
            <!-- Slide 1 -->
            <div class="flex flex-shrink-0 w-full gap-8">
                <img src="/assets/images/ropa-hombres/chaquetas/chaqueta2.webp" alt="img1" class="w-1/2 rounded-lg object-cover">
                <img src="/assets/images/ropa-mujeres/vestidos/vestido3.webp" alt="img2" class="w-1/2 rounded-lg object-cover">
            </div>
            <!-- Slide 2 -->
            <div class="flex flex-shrink-0 w-full gap-4">
                <img src="/assets/images/ropa-niños/chaquetas/chaqueta2.webp" alt="img3" class="w-1/3 rounded-lg object-cover">
                <img src="/assets/images/ropa-niños/jeans/pantalon2.webp" alt="img4" class="w-1/3 rounded-lg object-cover">
                <img src="/assets/images/ropa-mujeres/jeans/jean2.webp" alt="img5" class="w-1/3 rounded-lg object-cover">
            </div>
        </div>
        <!-- Controles -->
        <button data-prev id="prev" class="absolute left-0 top-1/2 -translate-y-1/2 bg-[var(--negro-tronco)] text-white px-3 py-2 rounded-full hover:bg-[var(--madera-tostada-elegante)] transition">
            ‹
        </button>
        <button data-next id="next" class="absolute right-0 top-1/2 -translate-y-1/2 bg-[var(--negro-tronco)] text-white px-3 py-2 rounded-full hover:bg-[var(--madera-tostada-elegante)] transition">
            ›
        </button>
    </div>
</section>

<script src="/secciones/secciones.js"></script>
</body>
</html>
