<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Carrito|Chevignon</title>
</head>

<body>
    <!-- PANEL LATERAL DE BOLSA -->
<div class="fixed top-0 right-0 w-full max-w-md h-full bg-white z-50 shadow-lg flex flex-col">

  <!-- Encabezado -->
  <div class="flex justify-between items-center p-4 border-b">
    <div class="flex items-center gap-2 font-medium text-base">
      <span class="text-xl"><img src="https://chevignon.vtexassets.com/assets/vtex.file-manager-graphql/images/4ed64a5a-7b89-40af-b31c-d85a1fa51334___7d5edaf384c76655da436c7883e31b32.svg" class="w-12 h-12"></span> Mi bolsa
    </div>
    <button class="text-xl">✖️</button>
  </div>

  <!-- Contenido del producto -->
  <div class="p-4 flex flex-col gap-4 flex-grow">

    <!-- Producto -->
    <div class="flex gap-4">
      <!-- Imagen -->
      <img class="w-20 h-auto object-cover"
        src="https://chevignon.vtexassets.com/arquivos/ids/1974086-96-auto"
        alt="Chaqueta">

      <!-- Info producto -->
      <div class="flex flex-col text-sm w-full">
        <!-- Título -->
        <p class="text-[14px] font-medium leading-snug mb-1">
          Chaqueta en Denim Tipo Trucker con Cuello en Cuero Azul Ultra Oscuro para Hombre
        </p>

        <!-- Talla y Color -->
        <div class="flex gap-2 text-[13px] text-gray-700 mb-1">
          <p><span class="font-semibold">Talla:</span> L</p>
          <p><span class="font-semibold">Color:</span> 63_322G450_AZU193924</p>
        </div>

        <!-- Precio -->
        <p class="text-[14px] font-semibold mb-2">$ 398.900</p>

        <!-- Cantidad + basura -->
        <div class="flex items-center gap-2">
          <button class="border border-black px-2 text-lg">−</button>
          <span class="text-sm">1</span>
          <button class="border border-black px-2 text-lg">+</button>
          <button class="ml-auto text-gray-500 hover:text-red-600 text-xl">🗑️</button>
        </div>
      </div>
    </div>

    <!-- Línea divisoria -->
    <hr class="my-2" />
  </div>

  <!-- Subtotal y total -->
  <div class="border-t p-4 text-sm">
    <div class="flex justify-between mb-2">
      <span>Subtotal</span>
      <span>$ 398.900</span>
    </div>
    <div class="flex justify-between font-bold text-base mb-1">
      <span>Total</span>
      <span>$ 398.900</span>
    </div>
    <p class="text-[11px] text-gray-500 mb-4">Tasas y fletes calculados en el carrito</p>

    <!-- Botón checkout -->
    <a href="cart2.html">
        <button class="w-full bg-black text-white py-3 font-semibold text-sm hover:bg-gray-800">
      Ir al checkout
    </button>
    </a>
  </div>
</div>
</body>

</html>
