<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolsa vacía</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-gray-100">

<!-- PANEL LATERAL DE LA BOLSA VACÍA -->
<div class="fixed top-0 right-0 w-full max-w-md h-full bg-white z-50 shadow-lg flex flex-col">

  <!-- Encabezado -->
  <div class="flex justify-between items-center p-4 border-b">
    <div class="flex items-center gap-2 font-medium text-base">
      <img src="https://chevignon.vtexassets.com/assets/vtex.file-manager-graphql/images/4ed64a5a-7b89-40af-b31c-d85a1fa51334___7d5edaf384c76655da436c7883e31b32.svg"
           alt="Ícono bolsa"
           class="w-5 h-5" />
      <span>Mi bolsa</span>
    </div>
    <button class="text-xl">✖️</button>
  </div>

  <!-- Contenido central: Bolsa vacía -->
  <div class="flex flex-col items-center justify-center text-center flex-grow px-4">
    <!-- Imagen SVG central -->
    <img src="https://chevignon.vtexassets.com/assets/vtex.file-manager-graphql/images/4ed64a5a-7b89-40af-b31c-d85a1fa51334___7d5edaf384c76655da436c7883e31b32.svg"
         alt="Bolsa vacía"
         class="w-20 h-20 mb-4" />

    <!-- Texto -->
    <p class="text-sm text-gray-700 mb-6">Tu bolsa está vacía</p>

    <!-- Botón -->
    <a href="/cart.html">
        <button class="bg-black text-white px-6 py-3 text-sm font-semibold hover:bg-gray-800">
      Ver Nueva Colección
    </button>
    </a>
  </div>

</div>

</body>
</html>
