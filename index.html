<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chevignon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header">
      <script>
        fetch("./partials/header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          });
      </script>
    </header>
    <section id="promocion">
      <script>
        fetch("./partials/promocion.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("promocion").innerHTML = data;
          });
      </script>
    </section>
    <main></main>
    <section id="envios">
      <script>
        fetch("./partials/envios.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("envios").innerHTML = data;
          });
      </script>
    </section>
    <footer id="footer">
      <script>
        fetch("./partials/footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer").innerHTML = data;
          });
      </script>
    </footer>
  </body>
</html>
